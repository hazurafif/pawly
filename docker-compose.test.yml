# Test-only override: run the e2e stack as its OWN project (pawly-e2e) on
# its own ports with an ephemeral tmpfs data dir, so Playwright never
# touches the dev backend (8080, named volume) or pollutes the emulator
# app's data with test pets. Every test starts from a clean server (no
# cross-test sync contamination).
name: pawly-e2e

services:
  backend:
    ports:
      - "8083:8080"
    environment:
      PAWLY_DATA_DIR: /tmp/pawly-test-data
    tmpfs:
      - /tmp/pawly-test-data

  app:
    ports:
      - "8084:80"
    build:
      args:
        # Baked into the e2e web bundle: the browser must reach the TEST
        # backend, never the dev one.
        EXPO_PUBLIC_PAWLY_URL: http://localhost:8083
