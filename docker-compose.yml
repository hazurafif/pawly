services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PAWLY_PORT: "8080"
    volumes:
      - pawly-data:/data
    restart: unless-stopped

  app:
    build:
      context: ./app
      args:
        # Baked into the web bundle: the browser must reach the backend
        # through the host port. For a LAN device, use the host's IP, e.g.
        # http://192.168.1.50:8080
        EXPO_PUBLIC_PAWLY_URL: http://localhost:8080
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pawly-data:
